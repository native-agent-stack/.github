# Orca (https://github.com/stablyai/orca) dual-machine workspace recipe for .github (v3.10.9)
# Supports portable Apple M5 Max (macOS) and paired stationary Noesis (Windows + WSL2 Noesis-Carbon).
# Cross-OS invariant: commands run identically in Win32 PowerShell, macOS zsh, and Linux bash.
scripts:
  setup: |
    uv run --no-project python --version
setupAgentStartupPolicy: start-immediately
defaultTabs:
  - title: Org Governance Agent
  - title: Org Merge & ADR Gate
    command: uv run --no-project python scripts/merge_gate.py
  - title: Org Manifest Tests
    command: uv run --no-project python -m unittest discover -s tests -v
